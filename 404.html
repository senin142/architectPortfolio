<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Anjali Design Studio</title>
  <meta name="robots" content="noindex">
  <!-- Absolute base so assets resolve from any 404'd path on GitHub Pages -->
  <base href="/architectPortfolio/">
  <script>(function(){var d=document.documentElement;d.className=d.className.replace('no-js','js');try{var t=localStorage.getItem('theme');if(t)d.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme: dark)').matches)d.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="error-page">
    <div class="container">
      <svg class="line-draw visible" viewBox="0 0 200 120" width="200" height="120" aria-hidden="true">
        <path class="draw-path" d="M10 110 H190" fill="none" stroke="currentColor"/>
        <path class="draw-path" d="M40 110 V50 H120 V110" fill="none" stroke="currentColor" style="--draw-delay: 0.2s"/>
        <path class="draw-path" d="M30 50 L80 20 L130 50" fill="none" stroke="currentColor" style="--draw-delay: 0.5s"/>
        <path class="draw-path" d="M120 80 H160 V110" fill="none" stroke="currentColor" style="--draw-delay: 0.8s"/>
      </svg>
      <h1>404<span class="visually-hidden"> — page not found</span></h1>
      <p>This space hasn't been built yet. The page you're looking for doesn't exist or has moved.</p>
      <a href="./" class="btn btn-primary">Back to Home</a>
    </div>
  </main>
</body>
</html>
